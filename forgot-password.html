<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Forgot Password | NERD</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-logo">
        NERD
      </div>

      <h1>Forgot Password?</h1>

      <p>
        Enter the email address associated with your NERD account
        and we'll send you a password reset link.
      </p>

      <form id="forgotPasswordForm">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          required
        >

        <button type="submit">
          Send Reset Link
        </button>

      </form>

      <p id="forgotPasswordMessage"></p>

      <a href="login.html">
        ← Back to Login
      </a>

    </section>

  </main>

  <script
    type="module"
    src="forgot-password.js">
  </script>

</body>
          </html>
