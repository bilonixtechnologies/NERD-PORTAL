<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEDR | Upload Project</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="container">

      <div class="brand">
        NEDR
      </div>

      <a href="dashboard.html" class="back-link">
        Dashboard
      </a>

    </div>
  </header>


  <main class="container">

    <section class="page-card">

      <div class="section-label">
        NEDR PROJECT
      </div>

      <h1>Upload Project</h1>

      <p class="intro">
        Your project-upload payment has been confirmed.
        You can now submit your project for review.
      </p>


      <form id="projectForm">

        <div class="form-group">

          <label for="projectTitle">
            Project Title
          </label>

          <input
            type="text"
            id="projectTitle"
            name="projectTitle"
            placeholder="Enter your project title"
            required
          >

        </div>


        <div class="form-group">

          <label for="projectFile">
            Project File
          </label>

          <input
            type="file"
            id="projectFile"
            name="projectFile"
            accept=".pdf,.doc,.docx"
            required
          >

          <small>
            Accepted formats: PDF, DOC, DOCX
          </small>

        </div>


        <div
          id="message"
          class="message"
          style="display:none;"
        ></div>


        <button
          type="submit"
          id="uploadButton"
          class="primary-btn"
        >
          Upload Project
        </button>

      </form>

    </section>

  </main>


  <script type="module">

    import {
      supabase,
      requireUser
    } from "./supabase.js";


    const user = await requireUser();


    if (!user) {
      window.location.href = "login.html";
    }


    const form =
      document.getElementById("projectForm");

    const titleInput =
      document.getElementById("projectTitle");

    const fileInput =
      document.getElementById("projectFile");

    const uploadButton =
      document.getElementById("uploadButton");

    const message =
      document.getElementById("message");


    function showMessage(text, success = false) {

      message.style.display = "block";

      message.textContent = text;

      message.style.color =
        success ? "#087443" : "#b42318";

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const title =
          titleInput.value.trim();

        const file =
          fileInput.files[0];


        if (!title) {

          showMessage(
            "Please enter your project title."
          );

          return;
        }


        if (!file) {

          showMessage(
            "Please select your project file."
          );

          return;
        }


        const allowedTypes = [
          "application/pdf",
          "application/msword",
          "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        ];


        if (!allowedTypes.includes(file.type)) {

          showMessage(
            "Please upload a PDF, DOC, or DOCX file."
          );

          return;
        }


        uploadButton.disabled = true;

        uploadButton.textContent =
          "Uploading...";


        try {

          const fileExtension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();


          const filePath =
            `${user.id}/${Date.now()}.${fileExtension}`;


          /*
            Upload project file to Supabase Storage.
          */

          const {
            error: uploadError
          } = await supabase.storage
            .from("projects")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


          if (uploadError) {

            throw uploadError;

          }


          /*
            Create project record.
          */

          const {
            error: projectError
          } = await supabase
            .from("projects")
            .insert({
              user_id: user.id,
              status: "pending"
            });


          if (projectError) {

            throw projectError;

          }


          showMessage(
            "Project uploaded successfully. It is now pending review.",
            true
          );


          uploadButton.textContent =
            "Upload Successful";


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 1500);


        } catch (error) {

          console.error(
            "Project upload error:",
            error
          );


          showMessage(
            error.message ||
            "Project upload failed."
          );


          uploadButton.disabled = false;

          uploadButton.textContent =
            "Upload Project";

        }

      }
    );

  </script>

</body>
  </html>
