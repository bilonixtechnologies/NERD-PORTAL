<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEDR - Project Upload</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #006b3f;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 13px;
      opacity: .9;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      color: #006b3f;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .fee {
      background: #f1f8f4;
      border-left: 5px solid #006b3f;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .fee strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
      color: #006b3f;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #006b3f;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .file-box {
      border: 2px dashed #bbb;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      margin-top: 8px;
      background: #fafafa;
    }

    .file-box input {
      border: none;
      padding: 5px;
      background: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #006b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #005331;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 7px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e7f7ed;
      color: #176b35;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a11;
    }

    .loading {
      display: block;
      background: #eef3f7;
      color: #333;
    }

    .payment-status {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 20px;
      font-size: 14px;
      background: #fff8e1;
      color: #795500;
    }

    .hidden {
      display: none;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #006b3f;
      text-decoration: none;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>NEDR</h1>
  <p>Project Submission Portal</p>
</header>

<div class="container">

  <div class="card">

    <h2>Project Upload</h2>

    <div class="fee">
      Project Upload Fee
      <strong>₦4,850</strong>
    </div>

    <div id="message" class="message"></div>

    <div id="paymentStatus" class="payment-status">
      Checking your project payment...
    </div>

    <form id="projectForm">

      <label for="submissionType">
        Submission Type
      </label>

      <select id="submissionType" required>
        <option value="">Select submission type</option>
        <option value="Project">Project</option>
        <option value="Correction">Correction</option>
        <option value="Final Submission">Final Submission</option>
      </select>

      <label for="projectTitle">
        Project Title
      </label>

      <textarea
        id="projectTitle"
        placeholder="Enter your project title"
        required
      ></textarea>

      <label for="supervisor">
        Supervisor
      </label>

      <input
        type="text"
        id="supervisor"
        placeholder="Enter supervisor's name"
        required
      >

      <label for="department">
        Department
      </label>

      <input
        type="text"
        id="department"
        placeholder="Enter department"
        required
      >

      <label for="projectFile">
        Upload Project File
      </label>

      <div class="file-box">
        <input
          type="file"
          id="projectFile"
          accept=".pdf,.doc,.docx"
          required
        >

        <p style="font-size:12px;color:#777;margin-top:8px;">
          Accepted formats: PDF, DOC, DOCX
        </p>
      </div>

      <button type="submit" id="uploadBtn">
        Upload Project
      </button>

    </form>

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

  </div>

</div>

<footer>
  © NEDR. All rights reserved.
</footer>

<script>

const SUPABASE_URL =
  "https://sqmieonrtwhehrbdxwmd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_jABLiODsCqH2AzMmBNIpbQ_sqRMJ2h7";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const PROJECT_BUCKET = "projects";
const PROJECT_FEE = 4850;

const messageBox =
  document.getElementById("message");

const paymentStatus =
  document.getElementById("paymentStatus");

const projectForm =
  document.getElementById("projectForm");

const uploadBtn =
  document.getElementById("uploadBtn");


function showMessage(text, type) {

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;
}


async function getCurrentUser() {

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if (error) {
    throw error;
  }

  if (!data.user) {
    throw new Error(
      "You are not logged in. Please log in first."
    );
  }

  return data.user;
}


/*
  Check the existing project payment.

  We deliberately look for a payment with:
  payment_type = project
  status       = paid
  amount       = 4800 or 4850

  Your current database record was previously showing
  project / paid / 4800, so both amounts are accepted
  here while we finish correcting the payment amount.
*/
async function checkProjectPayment(user) {

  paymentStatus.textContent =
    "Checking your project payment...";

  const possibleTables = [
    "payments",
    "payment"
  ];

  for (const table of possibleTables) {

    const {
      data,
      error
    } = await supabaseClient
      .from(table)
      .select("*")
      .eq("user_id", user.id)
      .eq("payment_type", "project")
      .eq("status", "paid")
      .order("created_at", {
        ascending: false
      })
      .limit(1);

    if (!error && data && data.length > 0) {

      const payment = data[0];

      const amount =
        Number(payment.amount || 0);

      if (
        amount === PROJECT_FEE ||
        amount === 4800
      ) {

        paymentStatus.textContent =
          "✓ Project payment verified.";

        paymentStatus.style.background =
          "#e7f7ed";

        paymentStatus.style.color =
          "#176b35";

        return true;
      }
    }
  }

  paymentStatus.textContent =
    "Project payment has not been verified. Please complete the ₦4,850 project payment first.";

  paymentStatus.style.background =
    "#fdeaea";

  paymentStatus.style.color =
    "#a11";

  return false;
}


async function uploadProject(event) {

  event.preventDefault();

  showMessage("", "");

  uploadBtn.disabled = true;

  uploadBtn.textContent =
    "Uploading...";

  try {

    const user =
      await getCurrentUser();

    const paymentConfirmed =
      await checkProjectPayment(user);

    if (!paymentConfirmed) {

      throw new Error(
        "Your project payment has not been verified."
      );
    }

    const file =
      document.getElementById(
        "projectFile"
      ).files[0];

    if (!file) {

      throw new Error(
        "Please select your project file."
      );
    }

    const submissionType =
      document.getElementById(
        "submissionType"
      ).value;

    const projectTitle =
      document.getElementById(
        "projectTitle"
      ).value.trim();

    const supervisor =
      document.getElementById(
        "supervisor"
      ).value.trim();

    const department =
      document.getElementById(
        "department"
      ).value.trim();


    /*
      Create a unique file path.

      The file goes into the exact Supabase
      Storage bucket:

      projects
    */

    const safeFileName =
      file.name
        .replace(/[^a-zA-Z0-9._-]/g, "_");

    const filePath =
      user.id +
      "/" +
      Date.now() +
      "_" +
      safeFileName;


    const {
      error: uploadError
    } = await supabaseClient
      .storage
      .from(PROJECT_BUCKET)
      .upload(
        filePath,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


    if (uploadError) {

      throw new Error(
        uploadError.message
      );
    }


    /*
      Save project information.

      We try the projects table first.
    */

    const projectRecord = {

      user_id: user.id,

      submission_type:
        submissionType,

      project_title:
        projectTitle,

      supervisor:
        supervisor,

      department:
        department,

      file_path:
        filePath,

      file_name:
        file.name,

      payment_type:
        "project",

      payment_status:
        "paid",

      amount:
        PROJECT_FEE
    };


    const {
      error: projectError
    } = await supabaseClient
      .from("projects")
      .insert(projectRecord);


    if (projectError) {

      /*
        The file has already uploaded.
        We don't silently pretend the database
        insert succeeded.
      */

      throw new Error(
        "Project file uploaded, but project details could not be saved: " +
        projectError.message
      );
    }


    showMessage(
      "Project uploaded successfully.",
      "success"
    );

    projectForm.reset();

    uploadBtn.textContent =
      "Upload Project";

  }

  catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Something went wrong while uploading your project.",
      "error"
    );

    uploadBtn.textContent =
      "Upload Project";

  }

  finally {

    uploadBtn.disabled = false;
  }
}


async function initializePage() {

  try {

    const user =
      await getCurrentUser();

    await checkProjectPayment(user);

  }

  catch (error) {

    console.error(error);

    paymentStatus.textContent =
      error.message;

    paymentStatus.style.background =
      "#fdeaea";

    paymentStatus.style.color =
      "#a11";

    uploadBtn.disabled = true;
  }
}


projectForm.addEventListener(
  "submit",
  uploadProject
);

initializePage();

</script>

</body>
  </html>
