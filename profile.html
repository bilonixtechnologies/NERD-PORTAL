<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NERD | Student Profile</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<header class="navbar">

<a
  href="dashboard.html"
  class="logo"
>

<span class="logo-box">N</span>

NERD 

</a>


<nav>

<a href="dashboard.html">
Dashboard
</a>

<a href="profile.html">
Profile
</a>

<a href="project.html">
Project
</a>

<a href="clearance.html">
Clearance
</a>

</nav>

</header>


<main class="profile-page">

<div class="page-heading">

<div class="eyebrow">
STUDENT REGISTRATION
</div>

<h1>
Complete your profile
</h1>

<p>
Provide accurate information. You must complete
your required information before proceeding
to registration payment.
</p>

</div>


<form id="profileForm">


<!-- =========================
     PERSONAL INFORMATION
========================= -->

<section class="profile-section">

<h2>
Personal Information
</h2>

<div class="form-grid">


<label>

First Name

<input
  type="text"
  id="firstName"
  required 
>

</label>


<label>

Middle Name

<input
  type="text"
  id="middleName"
>

</label>


<label>

Surname

<input
  type="text"
  id="surname"
  required 
>

</label>


<label>

Date of Birth *

<input
  type="date"
  id="dateOfBirth"
  required
>

</label>


<label>

Sex *

<select
  id="sex"
  required
>

<option value="">
Select sex
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>

</label>


<label>

Religion *

<select
  id="religion"
  required
>

<option value="">
Select religion
</option>

<option value="Christianity">
Christianity
</option>

<option value="Islam">
Islam
</option>

<option value="Traditional">
Traditional
</option>

<option value="Other">
Other
</option>

</select>

</label>


<label>

Nationality *

<input
  type="text"
  id="nationality"
  value="Nigerian"
  required
>

</label>


<label>

State of Origin *

<input
  type="text"
  id="stateOfOrigin"
  required
>

</label>


<label>

Local Government Area *

<input
  type="text"
  id="lga"
  required
>

</label>


<label>

Phone Number *

<input
  type="tel"
  id="phone"
  required
>

</label>

</div>

</section>


<!-- =========================
     CONTACT INFORMATION
========================= -->

<section class="profile-section">

<h2>
Contact Information
</h2>

<div class="form-grid">


<label>

Email Address

<input
  type="email"
  id="email"
  required 
>

</label>


<label>

Residential Address *

<input
  type="text"
  id="address"
  required
>

</label>


<label>

Contact State *

<input
  type="text"
  id="contactState"
  required
>

</label>


<label>

Contact LGA *

<input
  type="text"
  id="contactLga"
  required
>

</label>

</div>

</section>


<!-- =========================
     ACADEMIC INFORMATION
========================= -->

<section class="profile-section">

<h2>
Academic Information
</h2>

<div class="form-grid">


<label>

Institution *

<input
  type="text"
  id="institution"
  required
>

</label>


<label>

Faculty *

<input
  type="text"
  id="faculty"
  required
>

</label>


<label>

Department *

<input
  type="text"
  id="department"
  required
>

</label>


<label>

Programme *

<input
  type="text"
  id="programme"
  required
>

</label>


<label>

Matriculation /
Registration Number *

<input
  type="text"
  id="matricNumber"
  required
>

</label>


<label>

Degree *

<input
  type="text"
  id="degree"
  required
>

</label>


<label>

Level *

<select
  id="level"
  required
>

<option value="">
Select level
</option>

<option value="100 Level">
100 Level
</option>

<option value="200 Level">
200 Level
</option>

<option value="300 Level">
300 Level
</option>

<option value="400 Level">
400 Level
</option>

<option value="500 Level">
500 Level
</option>

<option value="Postgraduate">
Postgraduate
</option>

</select>

</label>


<label>

Academic Session *

<input
  type="text"
  id="session"
  placeholder="2025/2026"
  required
>

</label>

</div>

</section>


<!-- =========================
     PROJECT INFORMATION
========================= -->

<section class="profile-section">

<h2>
Project Information
</h2>

<div class="form-grid">


<label>

Project Title *

<input
  type="text"
  id="projectTitle"
  required
>

</label>


<label>

Supervisor Name *

<input
  type="text"
  id="supervisorName"
  required
>

</label>


<label>

Supervisor Email *

<input
  type="email"
  id="supervisorEmail"
  required
>

</label>


<label>

HOD Name *

<input
  type="text"
  id="hodName"
  required
>

</label>


<label>

HOD Email *

<input
  type="email"
  id="hodEmail"
  required
>

</label>

</div>

</section>


<button
  type="submit"
  class="primary-btn save-profile"
>

Save & Continue

</button>


<p
  id="profileMessage"
  class="form-message"
></p>


</form>

</main>


<script
  type="module"
  src="profile.js"
></script>

</body>

  </html>
