<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEDR | Payment Verification</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body class="auth-page">


<div class="auth-container">

  <div class="auth-card">

    <div class="eyebrow">
      NEDR PAYMENT
    </div>


    <h1 id="statusTitle">
      Verifying Payment
    </h1>


    <p id="statusDescription">
      Please wait while we securely verify
      your payment.
    </p>


    <div
      style="
        margin-top:20px;
        padding:18px;
        background:#f7faf8;
        border:1px solid #dfe4e8;
        text-align:left;
      "
    >

      <strong>
        Payment Reference
      </strong>

      <p
        id="paymentReference"
        style="word-break:break-all;"
      >
        —
      </p>


      <strong>
        Payment Type
      </strong>

      <p id="paymentType">
        —
      </p>


      <strong>
        Status
      </strong>

      <p id="paymentStatus">
        VERIFYING
      </p>

    </div>


    <p
      id="statusMessage"
      class="form-message"
    >
      Connecting to verification service...
    </p>


    <div
      id="successArea"
      style="display:none;"
    >

      <a
        href="dashboard.html"
        class="primary-btn full-btn"
      >
        Continue
      </a>

    </div>


    <div
      id="errorArea"
      style="display:none;"
    >

      <a
        href="payment.html?type=registration"
        class="primary-btn full-btn"
      >
        Return to Payment
      </a>

    </div>

  </div>

</div>


<script type="module">

import {
  supabase,
  requireUser
} from "./supabase.js";


const user =
  await requireUser();


if (!user) {

  throw new Error(
    "Authentication required."
  );

}


const statusTitle =
  document.getElementById(
    "statusTitle"
  );

const statusDescription =
  document.getElementById(
    "statusDescription"
  );

const statusMessage =
  document.getElementById(
    "statusMessage"
  );

const paymentReference =
  document.getElementById(
    "paymentReference"
  );

const paymentTypeElement =
  document.getElementById(
    "paymentType"
  );

const paymentStatus =
  document.getElementById(
    "paymentStatus"
  );

const successArea =
  document.getElementById(
    "successArea"
  );

const errorArea =
  document.getElementById(
    "errorArea"
  );


/*
  READ REFERENCE DIRECTLY FROM URL
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const reference =
  params.get(
    "reference"
  );


const paymentType =
  params.get(
    "type"
  );


/*
  Display payment information
*/

paymentReference.textContent =
  reference ||
  "Missing";


paymentTypeElement.textContent =
  paymentType ===
  "project_upload"

    ? "Project Upload"

    : "Registration";


/*
  No reference
*/

if (!reference) {

  statusTitle.textContent =
    "Payment Reference Missing";

  statusDescription.textContent =
    "No Paystack transaction reference was supplied.";

  statusMessage.style.color =
    "#c62828";

  statusMessage.textContent =
    "Please return to the payment page.";

  paymentStatus.textContent =
    "NOT VERIFIED";

  errorArea.style.display =
    "block";

}


/*
  Reference exists
*/

else {

  try {

    statusMessage.textContent =
      "Verifying transaction with Paystack...";


    /*
      Call Edge Function
    */

    const {
      data,
      error
    } =
      await supabase.functions.invoke(
        "verify-payment",
        {

          body: {

            reference:
              reference

          }

        }
      );


    console.log(
      "VERIFICATION DATA:",
      data
    );


    console.log(
      "VERIFICATION ERROR:",
      error
    );


    if (error) {

      throw new Error(
        error.message ||
        "Verification service failed."
      );

    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "Payment could not be verified."
      );

    }


    /*
      SUCCESS
    */

    paymentStatus.textContent =
      "PAID";

    paymentStatus.style.color =
      "#16824d";


    statusTitle.textContent =
      "Payment Verified Successfully";


    statusDescription.textContent =
      "Your NEDR payment has been successfully verified.";


    statusMessage.style.color =
      "#16824d";

    statusMessage.textContent =
      "Payment status: PAID";


    successArea.style.display =
      "block";


  } catch (error) {

    console.error(
      "VERIFICATION ERROR:",
      error
    );


    paymentStatus.textContent =
      "NOT VERIFIED";

    paymentStatus.style.color =
      "#c62828";


    statusTitle.textContent =
      "Payment Verification Failed";


    statusDescription.textContent =
      "We could not verify the Paystack transaction.";


    statusMessage.style.color =
      "#c62828";

    statusMessage.textContent =
      error.message ||
      "Verification failed.";


    errorArea.style.display =
      "block";

  }

}

</script>


</body>

  </html>
