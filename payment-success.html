<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEDR | Payment Verification</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

.success-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.success-card {
  width: 100%;
  max-width: 560px;
  text-align: center;
}

.status-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: #006b3f;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 800;
}

.status-icon.error {
  background: #c62828;
}

.success-card h1 {
  color: #006b3f;
  margin: 10px 0;
}

.success-card h1.error {
  color: #c62828;
}

.success-card p {
  color: #6b7280;
  line-height: 1.6;
}

.payment-details {
  margin-top: 25px;
  border: 1px solid #dfe4e8;
  background: #f7faf8;
  text-align: left;
}

.payment-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 13px 16px;
  border-bottom: 1px solid #dfe4e8;
}

.payment-row:last-child {
  border-bottom: 0;
}

.payment-label {
  color: #6b7280;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.payment-value {
  color: #1f2937;
  font-weight: 700;
  text-align: right;
  word-break: break-word;
}

.status-message {
  margin-top: 22px;
  font-weight: 600;
}

.button-area {
  margin-top: 25px;
}

</style>

</head>


<body class="auth-page">


<div class="success-page">

  <div class="auth-card success-card">


    <div
      id="statusIcon"
      class="status-icon"
    >
      ...
    </div>


    <div class="eyebrow">
      NEDR PAYMENT
    </div>


    <h1 id="statusTitle">
      Verifying Payment
    </h1>


    <p id="statusDescription">
      Please wait while we securely verify
      your payment with Paystack.
    </p>


    <div class="payment-details">


      <div class="payment-row">

        <span class="payment-label">
          Payment Type
        </span>

        <span
          class="payment-value"
          id="paymentType"
        >
          —
        </span>

      </div>


      <div class="payment-row">

        <span class="payment-label">
          Amount
        </span>

        <span
          class="payment-value"
          id="paymentAmount"
        >
          —
        </span>

      </div>


      <div class="payment-row">

        <span class="payment-label">
          Reference
        </span>

        <span
          class="payment-value"
          id="paymentReference"
        >
          —
        </span>

      </div>


      <div class="payment-row">

        <span class="payment-label">
          Status
        </span>

        <span
          class="payment-value"
          id="paymentStatus"
        >
          Verifying...
        </span>

      </div>


    </div>


    <p
      id="statusMessage"
      class="status-message"
    >
      Connecting to NEDR payment verification...
    </p>


    <div
      id="buttonArea"
      class="button-area"
      style="display:none;"
    >

      <a
        href="dashboard.html"
        class="primary-btn"
      >
        Return to Dashboard
      </a>

    </div>


  </div>

</div>


<script type="module">

import {
  supabase,
  requireUser
} from "./supabase.js";


/*
  Require authenticated student
*/

const user =
  await requireUser();


if (!user) {

  throw new Error(
    "Authentication required."
  );

}


/*
  Page elements
*/

const statusIcon =
  document.getElementById(
    "statusIcon"
  );

const statusTitle =
  document.getElementById(
    "statusTitle"
  );

const statusDescription =
  document.getElementById(
    "statusDescription"
  );

const statusMessage =
  document.getElementById(
    "statusMessage"
  );

const paymentTypeElement =
  document.getElementById(
    "paymentType"
  );

const paymentAmountElement =
  document.getElementById(
    "paymentAmount"
  );

const paymentReferenceElement =
  document.getElementById(
    "paymentReference"
  );

const paymentStatusElement =
  document.getElementById(
    "paymentStatus"
  );

const buttonArea =
  document.getElementById(
    "buttonArea"
  );


/*
  Get payment information
  saved before Paystack opened
*/

const reference =
  sessionStorage.getItem(
    "pendingPaymentReference"
  );

const paymentType =
  sessionStorage.getItem(
    "pendingPaymentType"
  );


/*
  Display payment type
*/

if (
  paymentType ===
  "project_upload"
) {

  paymentTypeElement.textContent =
    "Project Upload";

  paymentAmountElement.textContent =
    "₦4,850";

} else {

  paymentTypeElement.textContent =
    "Registration";

  paymentAmountElement.textContent =
    "₦2,500";

}


/*
  Display reference
*/

if (reference) {

  paymentReferenceElement.textContent =
    reference;

}


/*
  Missing reference
*/

if (!reference) {

  showError(
    "Payment Reference Missing",
    "We could not find the payment reference required to verify this transaction."
  );

} else {

  verifyPayment();

}


/*
  Verify payment
*/

async function verifyPayment() {

  try {

    statusMessage.textContent =
      "Verifying transaction with Paystack...";


    /*
      Call the deployed
      verify-payment Edge Function
    */

    const result =
      await supabase.functions.invoke(
        "verify-payment",
        {

          body: {

            reference:
              reference

          }

        }
      );


    const data =
      result.data;

    const error =
      result.error;


    console.log(
      "VERIFY PAYMENT DATA:",
      data
    );

    console.log(
      "VERIFY PAYMENT ERROR:",
      error
    );


    /*
      Edge Function error
    */

    if (error) {

      throw new Error(
        error.message ||
        "Unable to contact the payment verification service."
      );

    }


    /*
      Verification failed
    */

    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "Paystack could not verify this payment."
      );

    }


    /*
      PAYMENT VERIFIED
    */

    paymentStatusElement.textContent =
      "PAID";

    paymentStatusElement.style.color =
      "#16824d";


    statusIcon.textContent =
      "✓";

    statusIcon.classList.remove(
      "error"
    );


    statusTitle.textContent =
      "Payment Verified Successfully";

    statusTitle.classList.remove(
      "error"
    );


    statusDescription.textContent =
      "Your NEDR payment has been successfully verified.";


    statusMessage.style.color =
      "#16824d";

    statusMessage.textContent =
      "Your payment has been recorded successfully.";


    buttonArea.style.display =
      "block";


    /*
      Clear temporary payment
      information only after
      successful verification.
    */

    sessionStorage.removeItem(
      "pendingPaymentReference"
    );

    sessionStorage.removeItem(
      "pendingPaymentType"
    );


  } catch (error) {

    console.error(
      "PAYMENT VERIFICATION ERROR:",
      error
    );


    /*
      PAYMENT VERIFICATION FAILED
    */

    paymentStatusElement.textContent =
      "NOT VERIFIED";

    paymentStatusElement.style.color =
      "#c62828";


    statusIcon.textContent =
      "!";

    statusIcon.classList.add(
      "error"
    );


    statusTitle.textContent =
      "Payment Verification Failed";

    statusTitle.classList.add(
      "error"
    );


    statusDescription.textContent =
      "Your payment may have been completed, but NEDR could not verify it automatically.";


    statusMessage.style.color =
      "#c62828";

    statusMessage.textContent =
      error.message ||
      "Please return to the payment page and try again.";


    buttonArea.style.display =
      "block";

  }

}


/*
  Error display
*/

function showError(
  title,
  message
) {

  paymentStatusElement.textContent =
    "ERROR";

  paymentStatusElement.style.color =
    "#c62828";


  statusIcon.textContent =
    "!";

  statusIcon.classList.add(
    "error"
  );


  statusTitle.textContent =
    title;

  statusTitle.classList.add(
    "error"
  );


  statusDescription.textContent =
    message;


  statusMessage.style.color =
    "#c62828";

  statusMessage.textContent =
    "No payment verification was completed.";


  buttonArea.style.display =
    "block";

}

</script>


</body>

  </html>
