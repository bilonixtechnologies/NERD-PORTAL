<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEDR | Payment Verification</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

.success-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.success-card {
  width: 100%;
  max-width: 550px;
  text-align: center;
}

.status-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: #006b3f;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  font-weight: 800;
}

.status-icon.failed {
  background: #c62828;
}

.success-card h1 {
  color: #006b3f;
  margin-bottom: 12px;
}

.success-card h1.failed {
  color: #c62828;
}

.success-card p {
  color: #6b7280;
  line-height: 1.6;
}

.reference-box {
  margin: 25px 0;
  padding: 18px;
  background: #f7faf8;
  border: 1px solid #dfe4e8;
  border-radius: 5px;
}

.reference-label {
  display: block;
  color: #6b7280;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.reference-value {
  display: block;
  color: #006b3f;
  font-weight: 800;
  word-break: break-word;
}

.message {
  margin: 20px 0;
  font-weight: 600;
}

.button-area {
  margin-top: 25px;
}

</style>

</head>


<body class="auth-page">


<div class="success-page">

  <div class="auth-card success-card">

    <div
      id="statusIcon"
      class="status-icon"
    >
      ✓
    </div>


    <div class="eyebrow">
      NEDR PAYMENT
    </div>


    <h1 id="statusTitle">
      Verifying Payment...
    </h1>


    <p id="statusDescription">
      Please wait while we securely verify
      your payment with Paystack.
    </p>


    <div class="reference-box">

      <span class="reference-label">
        Payment Reference
      </span>

      <span
        class="reference-value"
        id="paymentReference"
      >
        Loading...
      </span>

    </div>


    <p
      id="statusMessage"
      class="message"
    >
      Connecting to payment verification...
    </p>


    <div
      id="buttonArea"
      class="button-area"
      style="display:none;"
    >

      <a
        href="dashboard.html"
        class="primary-btn"
      >
        Return to Dashboard
      </a>

    </div>

  </div>

</div>


<script type="module">

import {
  supabase,
  requireUser
} from "./supabase.js";


const user =
  await requireUser();


if (!user) {

  throw new Error(
    "Authentication required."
  );

}


const statusIcon =
  document.getElementById(
    "statusIcon"
  );

const statusTitle =
  document.getElementById(
    "statusTitle"
  );

const statusDescription =
  document.getElementById(
    "statusDescription"
  );

const paymentReference =
  document.getElementById(
    "paymentReference"
  );

const statusMessage =
  document.getElementById(
    "statusMessage"
  );

const buttonArea =
  document.getElementById(
    "buttonArea"
  );


const reference =
  sessionStorage.getItem(
    "pendingPaymentReference"
  );


const paymentType =
  sessionStorage.getItem(
    "pendingPaymentType"
  );


if (!reference) {

  statusIcon.textContent =
    "!";

  statusIcon.classList.add(
    "failed"
  );

  statusTitle.textContent =
    "Payment Reference Missing";

  statusTitle.classList.add(
    "failed"
  );

  statusDescription.textContent =
    "We could not find the payment reference required for verification.";

  statusMessage.textContent =
    "Please return to the payment page and try again.";

  buttonArea.style.display =
    "block";

} else {

  paymentReference.textContent =
    reference;


  try {

    statusMessage.textContent =
      "Verifying transaction with Paystack...";


    /*
      IMPORTANT:
      Your actual Supabase Edge Function
      is named smooth-api.
    */

    const {
      data,
      error
    } =
      await supabase.functions.invoke(
        "smooth-api",
        {
          body: {

            reference:
              reference,

            payment_type:
              paymentType

          }
        }
      );


    console.log(
      "VERIFICATION RESULT:",
      data
    );


    if (error) {

      console.error(
        "EDGE FUNCTION ERROR:",
        error
      );

      throw new Error(
        error.message ||
        "Unable to contact payment verification service."
      );

    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "Payment could not be verified."
      );

    }


    /*
      SUCCESS
    */

    statusIcon.textContent =
      "✓";

    statusIcon.classList.remove(
      "failed"
    );

    statusTitle.classList.remove(
      "failed"
    );

    statusTitle.textContent =
      "Payment Verified Successfully";

    statusDescription.textContent =
      "Your NEDR payment has been successfully verified.";

    statusMessage.style.color =
      "#16824d";

    statusMessage.textContent =
      "Payment status: PAID";

    buttonArea.style.display =
      "block";


    /*
      Clear temporary data
    */

    sessionStorage.removeItem(
      "pendingPaymentReference"
    );

    sessionStorage.removeItem(
      "pendingPaymentType"
    );


  } catch (error) {

    console.error(
      "PAYMENT VERIFICATION ERROR:",
      error
    );


    statusIcon.textContent =
      "!";

    statusIcon.classList.add(
      "failed"
    );

    statusTitle.classList.add(
      "failed"
    );

    statusTitle.textContent =
      "Payment Verification Failed";

    statusDescription.textContent =
      "Your payment was completed, but we could not verify it automatically.";

    statusMessage.style.color =
      "#c62828";

    statusMessage.textContent =
      error.message ||
      "Please try again.";

    buttonArea.style.display =
      "block";

  }

}

</script>


</body>

</html>
