<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEDR | Payment Verification</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body class="auth-page">


<div class="auth-container">

  <div class="auth-card">

    <div class="eyebrow">
      NEDR PAYMENT
    </div>


    <h1 id="statusTitle">
      Verifying Payment
    </h1>


    <p id="statusDescription">
      Please wait while we securely verify
      your payment.
    </p>


    <div
      style="
        margin-top:20px;
        padding:18px;
        background:#f7faf8;
        border:1px solid #dfe4e8;
        text-align:left;
      "
    >

      <strong>
        Payment Type
      </strong>

      <p id="paymentType">
        —
      </p>


      <strong>
        Amount
      </strong>

      <p id="paymentAmount">
        —
      </p>


      <strong>
        Reference
      </strong>

      <p
        id="paymentReference"
        style="word-break:break-all;"
      >
        Finding payment...
      </p>


      <strong>
        Status
      </strong>

      <p id="paymentStatus">
        VERIFYING
      </p>

    </div>


    <p
      id="statusMessage"
      class="form-message"
    >
      Finding your payment transaction...
    </p>


    <div
      id="successArea"
      style="display:none;"
    >

      <a
        href="dashboard.html"
        class="primary-btn full-btn"
      >
        Continue
      </a>

    </div>


    <div
      id="errorArea"
      style="display:none;"
    >

      <a
        href="payment.html?type=registration"
        class="primary-btn full-btn"
      >
        Return to Payment
      </a>

    </div>

  </div>

</div>


<script type="module">

import {
  supabase,
  requireUser
} from "./supabase.js";


/*
  Require logged-in user
*/

const user =
  await requireUser();


if (!user) {

  throw new Error(
    "Authentication required."
  );

}


/*
  Page elements
*/

const statusTitle =
  document.getElementById(
    "statusTitle"
  );

const statusDescription =
  document.getElementById(
    "statusDescription"
  );

const statusMessage =
  document.getElementById(
    "statusMessage"
  );

const paymentTypeElement =
  document.getElementById(
    "paymentType"
  );

const paymentAmountElement =
  document.getElementById(
    "paymentAmount"
  );

const paymentReferenceElement =
  document.getElementById(
    "paymentReference"
  );

const paymentStatusElement =
  document.getElementById(
    "paymentStatus"
  );

const successArea =
  document.getElementById(
    "successArea"
  );

const errorArea =
  document.getElementById(
    "errorArea"
  );


/*
  Get payment type from URL
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const requestedType =
  params.get("type");


/*
  Find latest pending payment
*/

async function findPendingPayment() {

  statusMessage.textContent =
    "Finding your pending payment...";


  let query =
    supabase
      .from("payments")
      .select(
        "id, user_id, payment_type, amount, status, gateway, reference, created_at"
      )
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "status",
        "pending"
      )
      .eq(
        "gateway",
        "paystack"
      );


  /*
    If payment type is known,
    use it.
  */

  if (
    requestedType ===
    "project"
  ) {

    query =
      query.eq(
        "payment_type",
        "project_upload"
      );

  } else {

    query =
      query.eq(
        "payment_type",
        "registration"
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(1)
      .maybeSingle();


  if (error) {

    console.error(
      "PAYMENT LOOKUP ERROR:",
      error
    );

    throw new Error(
      error.message
    );

  }


  return data;

}


/*
  Verify payment
*/

async function verifyPayment() {

  try {

    const payment =
      await findPendingPayment();


    /*
      No pending payment found
    */

    if (!payment) {

      throw new Error(
        "No pending Paystack payment was found for this account."
      );

    }


    /*
      Make sure reference exists
    */

    if (!payment.reference) {

      throw new Error(
        "The payment record does not contain a transaction reference."
      );

    }


    /*
      Display payment details
    */

    paymentReferenceElement.textContent =
      payment.reference;


    paymentTypeElement.textContent =
      payment.payment_type ===
      "project_upload"

        ? "Project Upload"

        : "Registration";


    paymentAmountElement.textContent =
      "₦" +
      Number(
        payment.amount
      ).toLocaleString();


    statusMessage.textContent =
      "Sending transaction reference for secure verification...";


    /*
      Call deployed Edge Function
    */

    const {
      data,
      error
    } =
      await supabase.functions.invoke(
        "verify-payment",
        {

          body: {

            reference:
              payment.reference

          }

        }
      );


    console.log(
      "VERIFY PAYMENT RESULT:",
      data
    );


    console.log(
      "VERIFY PAYMENT ERROR:",
      error
    );


    /*
      Edge Function communication error
    */

    if (error) {

      throw new Error(
        error.message ||
        "Unable to contact the payment verification service."
      );

    }


    /*
      Verification failed
    */

    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "Paystack could not verify this transaction."
      );

    }


    /*
      SUCCESS
    */

    paymentStatusElement.textContent =
      "PAID";

    paymentStatusElement.style.color =
      "#16824d";


    statusTitle.textContent =
      "Payment Verified Successfully";


    statusDescription.textContent =
      "Your NEDR payment has been successfully verified and recorded.";


    statusMessage.style.color =
      "#16824d";

    statusMessage.textContent =
      "Payment status: PAID";


    successArea.style.display =
      "block";


  } catch (error) {

    console.error(
      "PAYMENT VERIFICATION ERROR:",
      error
    );


    paymentStatusElement.textContent =
      "NOT VERIFIED";

    paymentStatusElement.style.color =
      "#c62828";


    statusTitle.textContent =
      "Payment Verification Failed";


    statusDescription.textContent =
      "We could not verify the payment automatically.";


    statusMessage.style.color =
      "#c62828";

    statusMessage.textContent =
      error.message ||
      "Payment verification failed.";


    errorArea.style.display =
      "block";

  }

}


/*
  Start verification
*/

verifyPayment();

</script>


</body>

  </html>
