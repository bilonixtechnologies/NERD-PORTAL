<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEDR | Payment</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

.payment-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.payment-card {
  width: 100%;
  max-width: 520px;
}

.payment-amount {
  margin: 25px 0;
  padding: 22px;
  background: #f7faf8;
  border: 1px solid #dfe4e8;
  border-radius: 6px;
  text-align: center;
}

.payment-amount span {
  display: block;
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 8px;
}

.payment-amount strong {
  display: block;
  color: #006b3f;
  font-size: 32px;
}

.payment-description {
  color: #6b7280;
  line-height: 1.6;
  text-align: center;
  margin-bottom: 25px;
}

.payment-message {
  min-height: 24px;
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

</style>

</head>


<body class="auth-page">


<div class="payment-page">

  <div class="auth-card payment-card">

    <div class="eyebrow">
      NEDR PAYMENT
    </div>


    <h1
      id="paymentTitle"
      style="text-align:center;"
    >
      Registration Payment
    </h1>


    <div class="payment-amount">

      <span>
        Amount Payable
      </span>

      <strong id="paymentAmount">
        ₦2,500
      </strong>

    </div>


    <p class="payment-description">

      Your payment must be successfully
      verified before the next stage of
      your NEDR registration becomes
      available.

    </p>


    <button
      id="payButton"
      class="primary-btn full-btn"
      type="button"
    >
      Continue to Payment
    </button>


    <p
      id="paymentMessage"
      class="payment-message"
      aria-live="polite"
    ></p>


  </div>

</div>


<!--
  Paystack's official InlineJS library.
  This loads before payment.js.
-->

<script
  src="https://js.paystack.co/v2/inline.js"
></script>


<!--
  NEDR payment application.
-->

<script
  type="module"
  src="./payment.js"
></script>


</body>

</html>
