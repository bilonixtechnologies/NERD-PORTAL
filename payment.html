<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEDR | Payment</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>

<body class="auth-page">

<div class="auth-container">

  <div class="auth-card">

    <div class="eyebrow">
      PAYMENT
    </div>

    <h1 id="paymentTitle">
      Registration Payment
    </h1>

    <div class="payment-amount">

      <span>
        Amount Payable
      </span>

      <strong id="paymentAmount">
        ₦2,500
      </strong>

    </div>

    <p>
      Your payment must be successfully verified
      before the next stage becomes available.
    </p>

    <button
      id="payButton"
      class="primary-btn full-btn"
    >
      Continue to Payment
    </button>

    <p
      id="paymentMessage"
      class="form-message"
    ></p>

  </div>

</div>


<script
  type="module"
  src="payment.js"
></script>

</body>

</html>
